name: Build and publish to maven on release

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7.0.1
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: 'Grant Permission to Gradle'
        run: chmod +x gradlew
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: 'Build with Gradle'
        run: ./gradlew build
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: Default
    env:
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7.0.1
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: 'Grant Permission to Gradle'
        run: chmod +x gradlew
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: 'Publish with Gradle'
        run: ./gradlew publish
